# Default configuration: the nine adversarial-ML artifacts studied in the paper.
# Copy this file and edit the `artifacts` list to study a different field.

# Where artifact repositories are cloned. Relative paths resolve against this
# file; when the package is installed from pip, clones go to ./artifact_repos.
repos_dir: ../artifact_repos

# Regular expressions whose first group captures an arXiv identifier.
paper_patterns:
  arxiv:
    - 'arxiv\.org/abs/(\d{4}\.\d{4,5})'
    - 'arxiv\.org/pdf/(\d{4}\.\d{4,5})'
    - 'arXiv[:\s]+(\d{4}\.\d{4,5})'
    - 'eprint\s*=\s*[{"](\d{4}\.\d{4,5})[}"]'

# File extensions scanned at HEAD to build the candidate pool.
scan_extensions: [.py, .md, .rst, .txt, .json, .yaml, .yml, .bib, .cfg, .toml]

# Identifiers excluded from the pool (general ML papers, not adversarial ML).
exclude_ids:
  - '1412.6980'   # Adam
  - '1506.02025'  # Spatial Transformer Networks
  - '1611.05431'  # ResNeXt
  - '2111.14725'  # ViT search
  - '1409.1556'   # VGG
  - '1512.03385'  # ResNet
  - '1409.4842'   # GoogLeNet
  - '1502.03167'  # Batch normalization

# Cross-validated subset: papers cited by at least `min_artifacts` artifacts,
# plus every paper cited by the artifacts listed under `always_include_from`.
selection:
  min_artifacts: 2
  always_include_from: [MITRE ATLAS]

artifacts:
  - name: CleverHans
    github_url: https://github.com/cleverhans-lab/cleverhans.git
    type: Tool
  - name: IBM ART
    github_url: https://github.com/Trusted-AI/adversarial-robustness-toolbox.git
    type: Tool
  - name: TextAttack
    github_url: https://github.com/QData/TextAttack.git
    type: Tool
  - name: PyRIT
    github_url: https://github.com/Azure/PyRIT.git
    type: Tool
  - name: Foolbox
    github_url: https://github.com/bethgelab/foolbox.git
    type: Tool
  - name: RobustBench
    github_url: https://github.com/RobustBench/robustbench.git
    type: Benchmark
  - name: AutoAttack
    github_url: https://github.com/fra31/auto-attack.git
    type: Benchmark
  - name: HarmBench
    github_url: https://github.com/centerforaisafety/HarmBench.git
    type: Benchmark
  - name: MITRE ATLAS
    github_url: https://github.com/mitre-atlas/atlas-data.git
    type: Regulatory
